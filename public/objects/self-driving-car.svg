<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A self-driving car in profile, a sensor pod on the roof, signal arcs radiating from both sides.">
  <!-- signal, radiating from the roof pod -->
  <g fill="none" stroke="#000" stroke-width="15" stroke-linecap="round">
    <path d="M179.7 124.3A90 90 0 0 0 179.7 219.7"/>
    <path d="M142.4 101.0A134 134 0 0 0 142.4 243.0"/>
    <path d="M105.1 77.7A178 178 0 0 0 105.1 266.3"/>
    <path d="M332.3 124.3A90 90 0 0 1 332.3 219.7"/>
    <path d="M369.6 101.0A134 134 0 0 1 369.6 243.0"/>
    <path d="M406.9 77.7A178 178 0 0 1 406.9 266.3"/>
  </g>

  <g stroke="#000" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
    <!-- sensor mast -->
    <rect x="270" y="168" width="26" height="40" fill="#3FA6DC"/>
    <rect x="248" y="146" width="70" height="26" rx="8" fill="#5B6B7E"/>
    <!-- sensor pod -->
    <rect x="214" y="196" width="126" height="36" rx="14" fill="#5B6B7E"/>

    <!-- body -->
    <path fill="#2E90D2" d="M26 344c0-14 10-24 24-26l122-16 42-60c4-8 12-12 22-12h106c10 0 20 4 27 11l55 47 46 6c12 2 20 12 20 24v50c0 12-10 22-22 22H48c-12 0-22-10-22-22z"/>

    <!-- glass -->
    <path fill="#5FC5EA" d="M242 240h28v48h-46z"/>
    <path fill="#49AFDF" d="M302 240h62l48 42v6H302z"/>
  </g>

  <!-- panel lines -->
  <g stroke="#000" stroke-width="15" stroke-linecap="round">
    <path d="M288 232v158"/>
    <path d="M178 330h172"/>
    <path d="M178 358h172"/>
    <path d="M456 322h34"/>
    <path d="M32 332h34"/>
  </g>

  <!-- wheels -->
  <g stroke="#000" stroke-linejoin="round">
    <circle cx="126" cy="378" r="46" fill="#55677C" stroke-width="15"/>
    <circle cx="402" cy="378" r="46" fill="#55677C" stroke-width="15"/>
    <circle cx="126" cy="378" r="17" fill="#2B3B4C" stroke-width="10"/>
    <circle cx="402" cy="378" r="17" fill="#2B3B4C" stroke-width="10"/>
  </g>
</svg>
